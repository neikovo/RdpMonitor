        <rect x="205" y="40" width="395" height="150" rx="14" fill="#ffffff" class="ink"/>
        <rect x="205" y="40" width="14" height="150" rx="6" fill="#f4811f"/>
        <text x="235" y="68" style="font:800 15px 'Segoe UI',Arial,sans-serif;fill:#d6620d">RDP Monitor - HIGH</text>
        <text x="235" y="96" style="font:600 15px 'Segoe UI',Arial,sans-serif;fill:#1b1f2a">50 failed RDP logons from 203.0.113.9</text>
        <line x1="235" y1="108" x2="585" y2="108" stroke="#dde2ee" stroke-width="2"/>
        <text x="235" y="134" style="font:600 15px 'Segoe UI',Arial,sans-serif;fill:#1b1f2a">ProcessStarted:</text>
        <text x="235" y="158" style="font:600 14px Consolas,'Courier New',monospace;fill:#b3260e">vssadmin delete shadows /all</text>
        <path d="M520 190 L506 232" stroke="#f4811f" stroke-width="3" stroke-dasharray="5 5"/>
      </g>
      <!-- speech bubble -->
      <g>
        <path d="M30 150 h130 a12 12 0 0 1 12 12 v34 a12 12 0 0 1 -12 12 h-40 l-14 22 l-4 -22 h-72 a12 12 0 0 1 -12 -12 v-34 a12 12 0 0 1 12 -12z" fill="#fff" class="ink" transform="translate(0,-4) scale(1.02,1) translate(-2,0)" opacity="0"/>
      </g>
    </g>
    <!-- speech bubble above head (drawn outside clip, inside panel bounds) -->
    <g>
      <path d="M26 128 h142 a12 12 0 0 1 12 12 v38 a12 12 0 0 1 -12 12 h-60 l-16 24 l-4 -24 h-62 a12 12 0 0 1 -12 -12 v-38 a12 12 0 0 1 12 -12z" fill="#fff" class="ink"/>
      <text class="bub" x="97" y="154" text-anchor="middle">...That is not a</text>
      <text class="bub" x="97" y="176" text-anchor="middle">normal night.</text>
    </g>
    <rect x="0" y="388" width="620" height="72" fill="#fff7c2" class="ink"/>
    <text class="cap" x="16" y="430">Then, at 2 a.m., the agent speaks up.</text>
    <rect x="0" y="0" width="620" height="460" fill="none" class="ink" style="stroke-width:5"/>
    <circle cx="26" cy="26" r="18" fill="#1b1f2a"/><text class="num" x="26" y="34" text-anchor="middle">3</text>
  </g>

  <!-- ================= PANEL 4 : The Payoff ================= -->
