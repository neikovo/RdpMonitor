        <rect x="30" y="268" width="380" height="76" rx="8" fill="#28385e"/>
        <rect x="30" y="236" width="18" height="108" rx="6" fill="#1d2a49"/>
        <ellipse cx="108" cy="262" rx="52" ry="22" fill="#e6ecfa"/>
        <circle cx="108" cy="250" r="26" fill="#f3c9a0"/>
        <path d="M82 244 Q108 218 134 244 Q122 234 108 234 Q94 234 82 244Z" fill="#3b2f2a"/>
