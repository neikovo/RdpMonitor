        <rect x="185" y="255" width="30" height="40" fill="#2b3345"/><rect x="150" y="292" width="100" height="10" rx="4" fill="#2b3345"/>
        <rect x="40" y="50" width="320" height="195" fill="#f4f7fb" class="thin"/>
      </g>
      <rect x="40" y="50" width="320" height="26" fill="#2d4a85"/>
      <text x="52" y="69" class="ui" fill="#fff">RDP Monitor - Dashboard</text>
      <g class="ui" fill="#1b1f2a">
        <circle cx="56" cy="96" r="6" fill="#2dbd6e"/><text x="72" y="100">SRV-01   Online</text><text x="190" y="100" fill="#4a5163">0 alerts</text>
        <circle cx="56" cy="120" r="6" fill="#2dbd6e"/><text x="72" y="124">SRV-02   Online</text><text x="190" y="124" fill="#4a5163">0 alerts</text>
        <circle cx="56" cy="144" r="6" fill="#2dbd6e"/><text x="72" y="148">SRV-03   Online</text>
        <text x="190" y="148" fill="#b3260e">2 high</text>
      </g>
      <rect x="50" y="160" width="300" height="76" fill="#fff0e3" stroke="#f4811f" stroke-width="2"/>
      <text x="58" y="178" style="font:800 12px 'Segoe UI',Arial,sans-serif;fill:#d6620d">HIGH  02:07  RdpLogonFailed  203.0.113.9</text>
      <text x="58" y="198" style="font:600 12px Consolas,'Courier New',monospace;fill:#1b1f2a">vssadmin delete shadows /all</text>
      <text x="58" y="216" style="font:600 11px 'Segoe UI',Arial,sans-serif;fill:#4a5163">Started by: cmd.exe   Privileges: elevated</text>
      <text x="58" y="231" style="font:600 11px 'Segoe UI',Arial,sans-serif;fill:#4a5163">E-mail sent: Yes</text>
      <g transform="translate(117,0)"><!-- admin with coffee -->
      <g class="ink">
        <rect x="415" y="300" width="22" height="50" rx="6" fill="#33405c"/>
        <rect x="445" y="300" width="22" height="50" rx="6" fill="#33405c"/>
        <rect x="407" y="232" width="68" height="76" rx="16" fill="#2a9d8f"/>
        <circle cx="441" cy="204" r="30" fill="#f3c9a0"/>
        <path d="M413 198 Q441 164 471 198 Q459 184 441 184 Q423 184 413 198Z" fill="#3b2f2a"/>
        <path d="M410 260 Q392 262 398 240" fill="none" stroke-width="12"/>
        <path d="M410 260 Q392 262 398 240" fill="none" stroke-width="7" stroke="#2a9d8f"/>
        <rect x="383" y="250" width="22" height="24" rx="4" fill="#fff"/><path d="M405 256 q9 3 0 11" fill="none"/>
      </g>
      <circle cx="432" cy="202" r="3" fill="#1b1f2a"/><circle cx="452" cy="202" r="3" fill="#1b1f2a"/>
      <path d="M430 216 Q442 224 454 216" fill="none" class="thin"/>
      </g><g transform="translate(-117,0)"><!-- colleague pointing -->
      <g class="ink">
        <rect x="533" y="300" width="22" height="50" rx="6" fill="#4a4a64"/>
        <rect x="560" y="300" width="22" height="50" rx="6" fill="#4a4a64"/>
        <rect x="525" y="232" width="66" height="76" rx="16" fill="#c0504d"/>
        <circle cx="558" cy="204" r="29" fill="#e9b88f"/>
        <path d="M530 200 Q558 168 588 200 Q576 190 558 190 Q540 190 530 200Z" fill="#7a4a2b"/>
        <path d="M528 252 Q505 242 480 226" fill="none" stroke-width="12"/>
        <path d="M528 252 Q505 242 480 226" fill="none" stroke-width="7" stroke="#c0504d"/>
      </g>
      <circle cx="548" cy="202" r="3" fill="#1b1f2a"/><circle cx="568" cy="202" r="3" fill="#1b1f2a"/>
      <ellipse cx="558" cy="217" rx="6" ry="5" fill="#fff" class="thin"/>
    </g></g>
    <!-- bubbles (inside panel bounds) -->
    <g>
      <path d="M392 12 h208 a12 12 0 0 1 12 12 v52 a12 12 0 0 1 -12 12 h-148 l-12 24 l-6 -24 h-42 a12 12 0 0 1 -12 -12 v-52 a12 12 0 0 1 12 -12z" fill="#fff" class="ink"/>
      <text class="bub" x="496" y="40" text-anchor="middle">You knew before anyone</text>
      <text class="bub" x="496" y="62" text-anchor="middle">was even awake?</text>
    </g>
    <g>
      <path d="M507 108 h96 a12 12 0 0 1 12 12 v18 a12 12 0 0 1 -12 12 h-36 l-8 20 l-6 -20 h-46 a12 12 0 0 1 -12 -12 v-18 a12 12 0 0 1 12 -12z" fill="#fff" class="ink"/>
      <text class="bub" x="555" y="127" text-anchor="middle">That is</text>
      <text class="bub" x="555" y="143" text-anchor="middle">RDP Monitor.</text>
    </g>
    <rect x="0" y="388" width="620" height="72" fill="#fff7c2" class="ink"/>
    <text class="cap" x="16" y="418">Every server. Every event. Before it becomes</text>
    <text class="cap" x="16" y="442">a bad morning.</text>
    <rect x="0" y="0" width="620" height="460" fill="none" class="ink" style="stroke-width:5"/>
    <circle cx="26" cy="26" r="18" fill="#1b1f2a"/><text class="num" x="26" y="34" text-anchor="middle">4</text>
  </g>

  <!-- footer -->
  <rect x="0" y="1120" width="1320" height="110" fill="#1b1f2a"/>
  <text x="660" y="1166" text-anchor="middle" style="font:800 26px 'Segoe UI',Arial,sans-serif;fill:#fff">RDP Monitor</text>
  <text x="660" y="1198" text-anchor="middle" style="font:500 18px 'Segoe UI',Arial,sans-serif;fill:#c9d2e6">Open source  -  MIT  -  github.com/neikovo/RdpMonitor</text>
