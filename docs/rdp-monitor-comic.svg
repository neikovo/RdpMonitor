<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1230" viewBox="0 0 1320 1230">
  <defs>
    <style>
      .ink { stroke:#1b1f2a; stroke-width:3; stroke-linejoin:round; stroke-linecap:round; }
      .thin { stroke:#1b1f2a; stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
      .cap  { font: 700 17px 'Segoe UI', Arial, sans-serif; fill:#1b1f2a; }
      .bub  { font: 700 15px 'Comic Sans MS', 'Segoe Print', cursive; fill:#1b1f2a; }
      .mono { font: 600 12px Consolas, 'Courier New', monospace; }
      .ui   { font: 600 12px 'Segoe UI', Arial, sans-serif; }
      .num  { font: 700 22px 'Segoe UI', Arial, sans-serif; fill:#fff; }
    </style>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9a3c" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c1"><rect width="620" height="460"/></clipPath>
  </defs>

  <rect width="1320" height="1230" fill="#f5f1e8"/>

  <!-- Title -->
  <text x="660" y="52" text-anchor="middle" style="font:800 40px 'Segoe UI',Arial,sans-serif;fill:#1b1f2a">RDP Monitor</text>
  <text x="660" y="86" text-anchor="middle" style="font:500 19px 'Segoe UI',Arial,sans-serif;fill:#4a5163">Know what happens on your servers - before it becomes a bad morning.</text>

  <!-- ================= PANEL 1 : The Blind Spot ================= -->
  <g transform="translate(30,110)">
    <g clip-path="url(#c1)">
      <rect width="620" height="460" fill="#cfdcf0"/>
      <rect y="330" width="620" height="130" fill="#b4c3dc"/>
      <!-- server room glass -->
      <rect x="320" y="50" width="290" height="285" class="ink" fill="#e6eefb"/>
      <rect x="320" y="50" width="290" height="285" fill="none" class="ink"/>
      <line x1="465" y1="50" x2="465" y2="335" class="thin"/>
      <!-- racks -->
      <g class="ink">
        <rect x="345" y="95" width="70" height="230" rx="4" fill="#2b3345"/>
        <rect x="430" y="95" width="70" height="230" rx="4" fill="#2b3345"/>
        <rect x="515" y="95" width="70" height="230" rx="4" fill="#2b3345"/>
      </g>
      <g stroke="#56617c" stroke-width="2">
        <line x1="352" y1="125" x2="408" y2="125"/><line x1="352" y1="155" x2="408" y2="155"/><line x1="352" y1="185" x2="408" y2="185"/><line x1="352" y1="215" x2="408" y2="215"/><line x1="352" y1="245" x2="408" y2="245"/><line x1="352" y1="275" x2="408" y2="275"/>
        <line x1="437" y1="125" x2="493" y2="125"/><line x1="437" y1="155" x2="493" y2="155"/><line x1="437" y1="185" x2="493" y2="185"/><line x1="437" y1="215" x2="493" y2="215"/><line x1="437" y1="245" x2="493" y2="245"/><line x1="437" y1="275" x2="493" y2="275"/>
        <line x1="522" y1="125" x2="578" y2="125"/><line x1="522" y1="155" x2="578" y2="155"/><line x1="522" y1="185" x2="578" y2="185"/><line x1="522" y1="215" x2="578" y2="215"/><line x1="522" y1="245" x2="578" y2="245"/><line x1="522" y1="275" x2="578" y2="275"/>
      </g>
      <g>
        <circle cx="400" cy="112" r="4" fill="#2dbd6e"/><circle cx="400" cy="142" r="4" fill="#2dbd6e"/><circle cx="400" cy="202" r="4" fill="#f4811f"/><circle cx="400" cy="262" r="4" fill="#2dbd6e"/>
        <circle cx="485" cy="112" r="4" fill="#2dbd6e"/><circle cx="485" cy="172" r="4" fill="#f4811f"/><circle cx="485" cy="232" r="4" fill="#2dbd6e"/><circle cx="485" cy="292" r="4" fill="#2dbd6e"/>
        <circle cx="570" cy="142" r="4" fill="#2dbd6e"/><circle cx="570" cy="202" r="4" fill="#2dbd6e"/><circle cx="570" cy="262" r="4" fill="#f4811f"/><circle cx="570" cy="292" r="4" fill="#2dbd6e"/>
      </g>
      <!-- floating question marks -->
      <g style="font:800 34px 'Segoe UI',Arial,sans-serif;fill:#f4811f" text-anchor="middle">
        <text x="380" y="82" transform="rotate(-10 380 82)">?</text>
        <text x="465" y="76" transform="rotate(6 465 76)">?</text>
        <text x="550" y="84" transform="rotate(-6 550 84)">?</text>
      </g>
      <!-- admin leaving -->
      <g class="ink">
        <rect x="95" y="300" width="22" height="48" rx="6" fill="#33405c"/>
        <rect x="128" y="300" width="22" height="48" rx="6" fill="#33405c"/>
        <rect x="88" y="218" width="68" height="96" rx="16" fill="#3d5a80"/>
        <circle cx="122" cy="190" r="30" fill="#f3c9a0"/>
        <path d="M94 184 Q122 150 152 184 Q140 170 122 170 Q104 170 94 184Z" fill="#3b2f2a"/>
        <!-- bag strap + bag -->
        <line x1="96" y1="226" x2="150" y2="300" stroke-width="4"/>
        <rect x="140" y="282" width="46" height="40" rx="6" fill="#8a5a3c"/>
        <!-- arm -->
        <path d="M92 240 Q70 270 82 300" fill="none" stroke-width="12" stroke="#1b1f2a"/>
        <path d="M92 240 Q70 270 82 300" fill="none" stroke-width="7" stroke="#3d5a80"/>
      </g>
      <circle cx="113" cy="188" r="3" fill="#1b1f2a"/><circle cx="133" cy="188" r="3" fill="#1b1f2a"/>
      <path d="M113 202 Q123 207 133 202" fill="none" class="thin"/>
      <!-- speech bubble -->
      <g>
        <path d="M24 38 h215 a14 14 0 0 1 14 14 v44 a14 14 0 0 1 -14 14 h-110 l-18 30 l-4 -30 h-83 a14 14 0 0 1 -14 -14 v-44 a14 14 0 0 1 14 -14z" fill="#fff" class="ink"/>
        <text class="bub" x="138" y="70" text-anchor="middle">I hope nothing</text>
        <text class="bub" x="138" y="92" text-anchor="middle">happens tonight.</text>
      </g>
    </g>
    <!-- caption -->
    <rect x="0" y="388" width="620" height="72" fill="#fff7c2" class="ink"/>
    <text class="cap" x="16" y="418">Dozens of servers. Zero idea what is happening</text>
    <text class="cap" x="16" y="442">on them after hours.</text>
    <rect x="0" y="0" width="620" height="460" fill="none" class="ink" style="stroke-width:5"/>
    <circle cx="26" cy="26" r="18" fill="#1b1f2a"/><text class="num" x="26" y="34" text-anchor="middle">1</text>
  </g>

  <!-- ================= PANEL 2 : The Build ================= -->
  <g transform="translate(670,110)">
    <clipPath id="c2"><rect width="620" height="460"/></clipPath>
    <g clip-path="url(#c2)">
      <rect width="620" height="460" fill="#1e2a44"/>
      <!-- window with moon -->
      <rect x="470" y="20" width="120" height="110" class="ink" fill="#0f1830"/>
      <line x1="530" y1="20" x2="530" y2="130" class="thin"/><line x1="470" y1="75" x2="590" y2="75" class="thin"/>
      <circle cx="500" cy="48" r="14" fill="#f2ecc8"/><circle cx="506" cy="44" r="12" fill="#0f1830"/>
      <!-- whiteboard -->
      <rect x="30" y="20" width="300" height="115" class="ink" fill="#ffffff"/>
      <rect x="48" y="45" width="100" height="40" rx="6" class="thin" fill="#d9f1ec"/>
      <text x="98" y="71" text-anchor="middle" style="font:800 16px 'Segoe UI',Arial,sans-serif;fill:#1b1f2a">AGENT</text>
      <rect x="215" y="45" width="100" height="40" rx="6" class="thin" fill="#dbe6fb"/>
      <text x="265" y="71" text-anchor="middle" style="font:800 16px 'Segoe UI',Arial,sans-serif;fill:#1b1f2a">SERVER</text>
      <path d="M152 65 H208" class="ink" fill="none"/><path d="M198 57 L210 65 L198 73" class="ink" fill="none"/>
      <text x="180" y="115" text-anchor="middle" style="font:700 14px 'Comic Sans MS',cursive;fill:#d6620d">e-mail me when it matters</text>
      <!-- desk -->
      <rect x="0" y="318" width="620" height="142" fill="#6a4f3b" class="ink"/>
      <!-- monitor left: terminal -->
