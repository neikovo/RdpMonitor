        <rect x="440" y="290" width="130" height="54" fill="#4a3b2f"/>
        <rect x="448" y="344" width="14" height="40" fill="#4a3b2f"/><rect x="548" y="344" width="14" height="40" fill="#4a3b2f"/>
        <rect x="476" y="238" width="58" height="52" rx="8" fill="#101521" stroke="#f4811f"/>
      </g>
      <rect x="484" y="246" width="42" height="30" rx="3" fill="#f4811f"/>
      <text x="505" y="266" text-anchor="middle" style="font:800 16px 'Segoe UI',Arial,sans-serif;fill:#fff">!</text>
      <!-- notification card -->
