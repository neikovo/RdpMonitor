    <clipPath id="c3"><rect width="620" height="460"/></clipPath>
    <g clip-path="url(#c3)">
      <rect width="620" height="460" fill="#0f1626"/>
      <!-- window moon -->
      <rect x="40" y="20" width="110" height="100" class="ink" fill="#16213d"/>
      <circle cx="75" cy="52" r="13" fill="#f2ecc8"/><circle cx="81" cy="48" r="11" fill="#16213d"/>
      <!-- floor -->
      <rect y="338" width="620" height="122" fill="#0a0f1b"/>
      <!-- glow -->
      <circle cx="500" cy="262" r="150" fill="url(#glow)"/>
      <!-- bed -->
