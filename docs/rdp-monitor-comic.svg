        <rect x="30" y="160" width="210" height="130" rx="6" fill="#0c1018"/>
        <rect x="120" y="290" width="30" height="26" fill="#2b3345"/><rect x="95" y="312" width="80" height="8" rx="3" fill="#2b3345"/>
      </g>
      <g class="mono" fill="#7ee0a0">
        <text x="42" y="186">&gt; .\install.ps1</text>
        <text x="42" y="206" fill="#9fb2d6">Installing service...</text>
        <text x="42" y="226">Agent installed  [OK]</text>
        <text x="42" y="246" fill="#9fb2d6">Status: Running</text>
        <text x="42" y="266">&gt; _</text>
      </g>
      <!-- monitor right: dashboard sketch -->
      <g class="ink">
        <rect x="262" y="140" width="220" height="150" rx="6" fill="#f4f7fb"/>
        <rect x="355" y="290" width="34" height="26" fill="#2b3345"/><rect x="330" y="312" width="84" height="8" rx="3" fill="#2b3345"/>
      </g>
      <rect x="262" y="140" width="220" height="24" fill="#2d4a85" class="thin"/>
      <text x="272" y="157" class="ui" fill="#fff">Dashboard</text>
      <g class="ui" fill="#1b1f2a">
        <circle cx="278" cy="184" r="5" fill="#2dbd6e"/><text x="292" y="188">SRV-01   Online</text>
        <circle cx="278" cy="208" r="5" fill="#2dbd6e"/><text x="292" y="212">SRV-02   Online</text>
        <circle cx="278" cy="232" r="5" fill="#2dbd6e"/><text x="292" y="236">SRV-03   Online</text>
        <rect x="272" y="248" width="200" height="30" fill="#eef2f9" class="thin"/>
        <text x="280" y="268" fill="#4a5163">Events  |  Settings</text>
      </g>
      <!-- mug + sandwich -->
      <g class="ink">
        <rect x="430" y="296" width="26" height="24" rx="4" fill="#f2f2f2"/><path d="M456 302 q10 4 0 12" fill="none"/>
        <path d="M20 322 l36 -10 l14 14 z" fill="#e8c27a"/>
      </g>
      <!-- admin at desk (from behind) -->
      <g class="ink">
        <rect x="498" y="250" width="100" height="80" rx="18" fill="#2a9d8f"/>
        <circle cx="548" cy="215" r="32" fill="#3b2f2a"/>
        <path d="M520 242 Q548 258 578 242 L582 252 Q548 270 516 252 Z" fill="#23867a"/>
        <rect x="508" y="300" width="80" height="30" rx="6" fill="#23867a"/>
      </g>
    </g>
    <rect x="0" y="388" width="620" height="72" fill="#fff7c2" class="ink"/>
    <text class="cap" x="16" y="418">So they built a watchman: a small agent on every</text>
    <text class="cap" x="16" y="442">server, one dashboard for all of them.</text>
    <rect x="0" y="0" width="620" height="460" fill="none" class="ink" style="stroke-width:5"/>
    <circle cx="26" cy="26" r="18" fill="#1b1f2a"/><text class="num" x="26" y="34" text-anchor="middle">2</text>
  </g>

  <!-- ================= PANEL 3 : The Alert ================= -->
